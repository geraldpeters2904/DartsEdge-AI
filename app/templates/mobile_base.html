<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#0b1220">
    <title>{% block title %}DartsEdge Mobile{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=11">

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #0b1220;
        }

        .mobile-app {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .mobile-app-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding:
                max(.75rem, env(safe-area-inset-top))
                max(1rem, env(safe-area-inset-right))
                .75rem
                max(1rem, env(safe-area-inset-left));
            border-bottom: 1px solid rgba(255, 255, 255, .09);
            background: rgba(11, 18, 32, .96);
            backdrop-filter: blur(12px);
        }

        .mobile-app-brand {
            display: flex;
            align-items: center;
            gap: .65rem;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .mobile-app-brand-icon {
            font-size: 1.55rem;
            line-height: 1;
        }

        .mobile-app-brand-name {
            font-weight: 850;
            line-height: 1.05;
        }

        .mobile-app-brand-subtitle {
            margin-top: .12rem;
            font-size: .72rem;
            opacity: .65;
        }

        .mobile-app-actions {
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .mobile-app-actions a {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 .8rem;
            border-radius: .65rem;
            text-decoration: none;
        }

        .mobile-app-main {
            width: min(100%, 900px);
            box-sizing: border-box;
            margin: 0 auto;
            padding:
                1rem
                max(1rem, env(safe-area-inset-right))
                max(2rem, env(safe-area-inset-bottom))
                max(1rem, env(safe-area-inset-left));
        }

        @media (max-width: 520px) {
            .mobile-app-brand-subtitle {
                display: none;
            }

            .mobile-app-main {
                padding-top: .8rem;
            }
        }
    </style>

    {% block mobile_head %}{% endblock %}
</head>
<body>
<div class="mobile-app">
    <header class="mobile-app-bar">
        <a
            class="mobile-app-brand"
            href="/mobile-opportunities"
            aria-label="DartsEdge mobile opportunities"
        >
            <span class="mobile-app-brand-icon">🎯</span>
            <span>
                <span class="mobile-app-brand-name">DartsEdge</span>
                <span class="mobile-app-brand-subtitle">
                    Mobile Opportunities
                </span>
            </span>
        </a>

        <div class="mobile-app-actions">
            {% block mobile_actions %}
            <a class="button secondary" href="/mobile-logout">
                Sign out
            </a>
            {% endblock %}
        </div>
    </header>

    <main class="mobile-app-main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
